name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    env:
      BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL != '' && secrets.BACKEND_BASE_URL || 'https://clipmemo.dnabil.ovh' }}
      # Volontairement NON secret : ce job ne sert qu'a valider la compilation et les tests.
      # Injecter ici la vraie APP_SECRET_KEY la graverait en clair dans le dex des APK produits.
      BACKEND_APP_KEY: ci-build-only-not-a-real-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      # Aucun APK n'est publie en artefact : le depot est public, et tout binaire
      # televersable exposerait les valeurs de BuildConfig a quiconque. Les builds
      # distribuables sont produits localement et televerses sur la Play Console.
